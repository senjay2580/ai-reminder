name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*'] # 推 v1.2.3 之类的 tag → 测试、构建、发 Release,APP 里就能检查到更新
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成更新说明要找上一个 tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Test & build
        working-directory: android
        run: gradle testDebugUnitTest assembleRelease --no-daemon --console=plain ${{ startsWith(github.ref, 'refs/tags/v') && format('-Ptag={0}', github.ref_name) || '' }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AiReminder-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AiReminder-APK
          path: out/*.apk
          retention-days: 14

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --pretty='- %s' ${prev:+$prev..}HEAD > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*.apk
          body_path: notes.md
